<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>CSS Grid</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .box { background: lightblue; padding: 30px; text-align: center; font-size: 24px; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    <div class="box">4</div><div class="box">5</div><div class="box">6</div>
  </div>
</body>
</html>
